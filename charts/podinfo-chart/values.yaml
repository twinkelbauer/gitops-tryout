replicaCount: 1

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.1"
  pullPolicy: IfNotPresent

ui:
  color: "#34577c"
  message: "hello from podinfo"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: localhost

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
